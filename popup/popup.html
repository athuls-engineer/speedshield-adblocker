<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ubo-popup">
    <!-- Top Bar -->
    <header class="ubo-header">
      <div class="ubo-title" id="openSettingsBtn" title="Open the dashboard">
        <img src="../icons/icon16.png" class="ubo-logo" alt="">
        <span class="ubo-app-name">SpeedShield</span>
        <span class="ubo-version">1.1.0</span>
      </div>
      <div class="ubo-header-tools">
        <button class="ubo-header-btn" id="activateZapperBtn" title="Enter element zapper mode (Alt+Z)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </button>
        <button class="ubo-header-btn" id="dashboardBtn" title="Open the dashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Domain Display & The Iconic uBO Power Button -->
    <div class="ubo-main-action">
      <div class="ubo-domain-label" id="domainDisplay" title="Current website">
        <span class="domain-text" id="domainText">character.ai</span>
      </div>

      <div class="ubo-power-container">
        <button class="ubo-power-btn" id="whitelistBtn" title="Click to toggle blocking on this site">
          <svg class="ubo-power-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          <span id="whitelistBtnText" style="display: none;">Allow on Site</span>
          <span id="whitelistIcon" style="display: none;">🛡️</span>
        </button>

        <button class="ubo-reload-btn" id="reloadPromptBtn" title="Click to reload page" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- uBO Stats Table -->
    <div class="ubo-stats-table">
      <div class="ubo-stat-row">
        <span class="ubo-stat-title">Requests blocked</span>
        <span class="ubo-stat-val" id="pageBlockedCount">0</span>
      </div>
      <div class="ubo-stat-row">
        <span class="ubo-stat-title">Since install</span>
        <span class="ubo-stat-val" id="totalBlockedCount">0</span>
      </div>
      <div class="ubo-stat-row">
        <span class="ubo-stat-title">Custom rules</span>
        <span class="ubo-stat-val" id="customFiltersCount">0</span>
      </div>
    </div>

    <!-- Bottom Utility Icon Bar -->
    <div class="ubo-bottom-bar">
      <button class="ubo-icon-btn active" id="cookieChip" title="Cosmetic filtering & Cookie Defuser (Click to toggle)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"></path>
          <path d="M8.5 8.5v.01"></path>
          <path d="M7 14v.01"></path>
          <path d="M15 15v.01"></path>
          <path d="M11 17v.01"></path>
        </svg>
      </button>

      <button class="ubo-icon-btn active" id="urlCleanerChip" title="URL Tracking Stripper (Click to toggle)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
      </button>

      <button class="ubo-icon-btn" id="runPopupAuditBtn" title="Live Security & Privacy Audit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </button>

      <button class="ubo-icon-btn" id="updateRulesBtn" title="Update filter lists now">
        <svg id="updateIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span id="updateBtnText" style="display: none;">Check Now</span>
      </button>
    </div>

    <!-- Live Audit Dropdown (Hidden until clicked) -->
    <div id="popupAuditResults" class="ubo-audit-drawer" style="display: none;"></div>

    <!-- Status Footer -->
    <footer class="ubo-footer">
      <span id="lastUpdatedText">Filters up to date</span>
    </footer>

    <!-- Hidden compatibility elements to support all existing controller hooks -->
    <div style="display: none;">
      <input type="checkbox" id="masterToggle" checked>
      <span id="statusBadge">PROTECTED</span>
      <span id="toggleStatusText">Ad & Tracker Shield</span>
      <span id="toggleSubtitle">Active on all web traffic</span>
      <span id="updaterModeText">Continuous background sync</span>
      <div id="privacyStatusBar"></div>
    </div>
  </div>

  <script src="../content/popup-defuser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
